kbin_bot: Mbin-agent
bot_body_content: |-
  Välkommen till Mbin-agenten! Agenten har en central roll i att möjliggöra ActivityPub-funktioner i Mbin. Den ser till att Mbin kan kommunicera och federera med andra instanser i fediversum.

  ActivityPub är ett öppet standardprotokoll som gör att decentraliserade sociala plattformar kan kommunicera och samverka med varandra. Användare på olika instanser (servrar) kan följa varandra, interagera och dela innehåll i det federerade sociala nätverk som kallas fediversum. Protokollet ger användarna ett standardiserat sätt att publicera innehåll, följa andra användare och interagera genom att exempelvis gilla, dela och kommentera trådar eller inlägg.
