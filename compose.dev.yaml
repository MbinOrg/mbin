# Development environment override
services:
    php:
        pull_policy: build
        build:
            dockerfile: docker/Dockerfile
            context: .
            target: dev
        volumes:
            - ./:/app
            - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
            - ./docker/conf.d/20-app.dev.ini:/usr/local/etc/php/app.conf.d/20-app.dev.ini:ro
            # If you develop on Mac or Windows you can remove the vendor/ directory
            #  from the bind-mount for better performance by enabling the next line:
            #- /app/vendor
        environment:
            # See https://xdebug.org/docs/all_settings#mode
            XDEBUG_MODE: '${XDEBUG_MODE:-off}'
            FRANKENPHP_WORKER_CONFIG: watch
            MERCURE_EXTRA_DIRECTIVES: demo
        ports:
            - 8081:8081
        extra_hosts:
            # Ensure that host.docker.internal is correctly defined on Linux
            - host.docker.internal:host-gateway
        tty: true

    m3u8-fixture:
        image: docker.io/library/busybox:1.37.0
        profiles:
            - m3u8-fixture
        network_mode: service:php
        command: ['httpd', '-f', '-p', '8081', '-h', '/fixtures']
        volumes:
            - ./tests/assets/m3u8-embed:/fixtures:ro
        depends_on:
            - php

    node:
        image: docker.io/library/node:26-trixie-slim
        user: ${MBIN_USER}
        volumes:
            - ./:/app
        working_dir: /app
        command: ['sh', '-c', 'npm install && npm run watch']

    messenger:
        pull_policy: build
        build:
            dockerfile: docker/Dockerfile
            context: .
            target: dev
        volumes:
            - ./:/app
            - ./docker/conf.d/20-app.dev.ini:/usr/local/etc/php/app.conf.d/20-app.dev.ini:ro
            # If you develop on Mac or Windows you can remove the vendor/ directory
            #  from the bind-mount for better performance by enabling the next line:
            #- /app/vendor
        environment:
            # See https://xdebug.org/docs/all_settings#mode
            XDEBUG_MODE: '${XDEBUG_MODE:-off}'
        extra_hosts:
            # Ensure that host.docker.internal is correctly defined on Linux
            - host.docker.internal:host-gateway
        tty: true
        deploy:
            mode: replicated
            # Change to 1 to enable federation
            replicas: 0

    amqproxy:
        deploy:
            mode: replicated
            # Change to 1 to enable federation
            replicas: 0

    rabbitmq:
        deploy:
            mode: replicated
            # Change to 1 to enable federation
            replicas: 0
