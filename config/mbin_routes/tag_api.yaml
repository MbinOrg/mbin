api_tag_entries:
  controller: App\Controller\Api\Tag\TagContentRetrieveApiController::entries
  path: /api/tag/{name}/entries
  methods: [ GET ]
  format: json

api_tag_entry_comments:
  controller: App\Controller\Api\Tag\TagContentRetrieveApiController::entryComments
  path: /api/tag/{name}/entryComments
  methods: [ GET ]
  format: json

api_tag_posts:
  controller: App\Controller\Api\Tag\TagContentRetrieveApiController::posts
  path: /api/tag/{name}/posts
  methods: [ GET ]
  format: json

api_tag_post_comments:
  controller: App\Controller\Api\Tag\TagContentRetrieveApiController::postComments
  path: /api/tag/{name}/postComments
  methods: [ GET ]
  format: json

api_tag_block:
  controller: App\Controller\Api\Tag\TagBlockApi::block
  path: /api/tag/{name}/block
  methods: [ PUT ]
  format: json

api_tag_unblock:
  controller: App\Controller\Api\Tag\TagBlockApi::unblock
  path: /api/tag/{name}/unblock
  methods: [ PUT ]
  format: json

api_tag_blocked:
  controller: App\Controller\Api\Tag\TagBlockApi::list
  path: /api/tags/blocked
  methods: [ GET ]
  format: json
